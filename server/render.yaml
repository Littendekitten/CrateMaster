services:
  - type: web
    name: cratemaster-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FORMSPREE_ENDPOINT
        sync: false
      - key: GEM_APPROVE_SECRET
        sync: false
      - key: PUBLIC_SERVER_URL
        value: https://cratemaster.onrender.com
      - key: ADMIN_UIDS
        sync: false
